<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1d1d1d);
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
}

h1{
    margin:30px 0;
    font-size:38px;
    letter-spacing:2px;
    text-shadow:0 0 20px rgba(255,255,255,.25);
}

.gallery{
    width:95%;
    max-width:430px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border-radius:25px;
    padding:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.gallery img{
    width:100%;
    border-radius:20px;
    transition:.4s;
    cursor:pointer;
}

.gallery img:hover{
    transform:scale(1.02);
}

.buttons{
    width:95%;
    max-width:430px;
    display:flex;
    gap:12px;
    justify-content:center;
    margin:20px auto;
}

button{
    background:#ffffff;
    color:#111;
    border:none;
    border-radius:50px;
    padding:14px 30px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}
</style>
</head>

<body>

<h1> Личная галерея </h1>

<div class="gallery">
   <img id="photo" src="images/photo1.jpg" onclick="window.open(this.src)">
</div>
    
<div class="buttons">
    <button onclick="prev()">◀ Назад</button>
    <button onclick="next()">Вперед ▶</button>
</div>

<script>
const photos=[
"images/photo1.jpg",
"images/photo2.jpg"
];

let index=0;

function show(){
document.getElementById("photo").src=photos[index];
}

function next(){
index++;
if(index>=photos.length) index=0;
show();
}

function prev(){
    index--;
    if(index<0) index=photos.length-1;
    show();
}

function toggleMusic(){
    const music = document.getElementById("music");

    if(music.paused){
        music.play();
    }else{
        music.pause();
    }
}
</script>
<audio id="music" src="song.mp3"></audio>

<div style="position:fixed;bottom:20px;right:20px;">
    <button onclick="toggleMusic()">🎵 Музыка</button>
</div>
</body>
</html>
